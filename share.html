<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Your Photo - Blessing Snap</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
</head>
<body class="bg-zinc-950 text-white min-h-screen flex flex-col font-sans">

    <header class="bg-zinc-900 border-b border-zinc-800 p-4 text-center sticky top-0 z-10 shadow-lg">
        <h1 class="text-xl font-black tracking-widest uppercase text-sky-400">BLESSING SNAP</h1>
        <p class="text-xs text-zinc-400 mt-1 uppercase tracking-wider">Thanks for joining us!</p>
    </header>

    <main class="flex-1 p-4 flex flex-col items-center max-w-lg mx-auto w-full space-y-4 mt-4">
        
        <!-- Loading State -->
        <div id="loading" class="flex flex-col items-center justify-center py-20 text-zinc-400">
            <i class="fa-solid fa-spinner fa-spin text-3xl mb-4 text-sky-500"></i>
            <p class="text-sm font-semibold tracking-wide uppercase">กำลังโหลดรูปภาพ...</p>
        </div>

        <!-- Error State -->
        <div id="error" class="hidden flex-col items-center justify-center py-20 text-red-400 text-center px-4">
            <i class="fa-regular fa-face-frown text-4xl mb-4"></i>
            <p class="font-bold">ไม่พบรูปภาพ</p>
            <p class="text-xs text-zinc-500 mt-2">ลิงก์อาจหมดอายุ หรือถูกลบออกจากระบบแล้ว</p>
        </div>

        <!-- 🌟 ป้ายแจ้งเตือนเฉพาะตอนเปิดในแอป LINE/FB 🌟 -->
        <div id="line-warning" class="hidden w-full bg-red-900/80 border border-red-500 text-white p-3.5 rounded-xl text-sm mb-2 text-center shadow-lg leading-relaxed">
            <i class="fa-solid fa-triangle-exclamation text-lg text-red-300 mb-1 block"></i>
            คุณกำลังเปิดผ่านแอปพลิเคชันที่บล็อกการโหลดรูป<br>
            กรุณากดปุ่ม <b><i class="fa-solid fa-ellipsis-vertical mx-1"></i> (3 จุดมุมขวาบน)</b><br>
            แล้วเลือก <b>"เปิดด้วยเบราว์เซอร์เริ่มต้น"</b> เพื่อบันทึกรูปภาพครับ
        </div>

        <!-- Photos Container -->
        <div id="photo-container" class="hidden w-full pb-10">
            <div class="space-y-8">
                <!-- Color Photo -->
                <div class="bg-zinc-900 border border-zinc-800 rounded-2xl p-4 shadow-xl">
                    <div class="flex items-center gap-2 mb-3 px-1">
                        <span class="w-3 h-3 rounded-full bg-emerald-500"></span>
                        <h2 class="font-bold text-sm uppercase tracking-wide">ภาพสี (Color)</h2>
                    </div>
                    <div class="w-full bg-black rounded-lg overflow-hidden border border-zinc-700 mb-4 flex justify-center">
                        <img id="img-color" src="" class="w-full h-auto object-contain max-h-[60vh] pointer-events-auto" style="-webkit-touch-callout: default;">
                    </div>
                    <button onclick="downloadImage('color')" class="w-full bg-emerald-600 hover:bg-emerald-500 text-white font-bold py-3.5 rounded-xl transition flex items-center justify-center gap-2 shadow-lg active:scale-95">
                        <i class="fa-solid fa-download"></i> บันทึกรูปภาพสี
                    </button>
                </div>

                <!-- B&W Photo -->
                <div class="bg-zinc-900 border border-zinc-800 rounded-2xl p-4 shadow-xl">
                    <div class="flex items-center gap-2 mb-3 px-1">
                        <span class="w-3 h-3 rounded-full bg-zinc-400"></span>
                        <h2 class="font-bold text-sm uppercase tracking-wide text-zinc-300">ภาพขาวดำ (Black & White)</h2>
                    </div>
                    <div class="w-full bg-black rounded-lg overflow-hidden border border-zinc-700 mb-4 flex justify-center">
                        <img id="img-bw" src="" class="w-full h-auto object-contain max-h-[60vh] pointer-events-auto" style="-webkit-touch-callout: default;">
                    </div>
                    <button onclick="downloadImage('bw')" class="w-full bg-zinc-700 hover:bg-zinc-600 text-white font-bold py-3.5 rounded-xl transition flex items-center justify-center gap-2 shadow-lg active:scale-95 border border-zinc-600">
                        <i class="fa-solid fa-download"></i> บันทึกรูปภาพขาวดำ
                    </button>
                </div>
            </div>
        </div>
    </main>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.9.0/firebase-app.js";
        import { getFirestore, doc, getDoc } from "https://www.gstatic.com/firebasejs/10.9.0/firebase-firestore.js";

        const firebaseConfig = {
            apiKey: "AIzaSyA57qyFTexeNyRMTTLUJMNC5Bm24L_K0io",
            authDomain: "blessing-snap.firebaseapp.com",
            projectId: "blessing-snap",
            storageBucket: "blessing-snap.firebasestorage.app",
            messagingSenderId: "324842012527",
            appId: "1:324842012527:web:96a235fbf494d39ce9f29a"
        };

        const app = initializeApp(firebaseConfig);
        const db = getFirestore(app);
        let photoData = null;

        const urlParams = new URLSearchParams(window.location.search);
        const photoId = urlParams.get('id');

        // ตรวจจับแอปพลิเคชัน (LINE, Facebook, IG)
        const ua = navigator.userAgent || navigator.vendor || window.opera;
        const isInAppBrowser = (ua.indexOf("Line") > -1) || (ua.indexOf("FBAN") > -1) || (ua.indexOf("FBAV") > -1) || (ua.indexOf("Instagram") > -1);

        if (isInAppBrowser) {
            // โชว์ป้ายเตือนถ้าลูกค้าดื้อเปิดผ่าน In-app browser แล้วมันไม่ยอมเด้งออก
            document.getElementById('line-warning').style.display = 'block';
        }

        async function fetchPhoto() {
            if (!photoId) return showError();
            try {
                const docSnap = await getDoc(doc(db, "photos", photoId));
                if (docSnap.exists()) {
                    photoData = docSnap.data();
                    document.getElementById('img-color').src = photoData.url;
                    document.getElementById('img-bw').src = photoData.bw_url;
                    document.getElementById('loading').style.display = 'none';
                    document.getElementById('photo-container').style.display = 'block';
                } else {
                    showError();
                }
            } catch (error) {
                console.error(error); showError();
            }
        }

        function showError() {
            document.getElementById('loading').style.display = 'none';
            document.getElementById('error').style.display = 'flex';
        }

        window.downloadImage = async (type) => {
            if(!photoData) return;
            const targetUrl = type === 'color' ? photoData.url : photoData.bw_url;

            // ถ้าเปิดผ่านแอป LINE/FB ให้กดปุ่มแล้วเปิดรูปเต็มจอ เพื่อให้แตะค้างเซฟง่ายๆ
            if (isInAppBrowser) {
                window.location.href = targetUrl;
                return;
            }

            const fileName = `BlessingSnap_${type}_${Date.now()}.jpg`;

            try {
                const response = await fetch(targetUrl);
                const blob = await response.blob();
                const blobUrl = window.URL.createObjectURL(blob);
                
                const link = document.createElement('a');
                link.href = blobUrl;
                link.download = fileName;
                
                document.body.appendChild(link);
                link.click();
                
                document.body.removeChild(link);
                window.URL.revokeObjectURL(blobUrl);
            } catch(e) {
                window.location.href = targetUrl;
            }
        };

        fetchPhoto();
    </script>
</body>
</html>
